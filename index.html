  pedido?: PedidoRetorno
}`,
PrecioRetorno: `{
  id (idPrecio): string
  fechaCreacion?: Date
  fechaActualizacion?: Date
  deleted?: boolean
  nombre: string
  descripcion?: string
  abreviatura?: PrecioAbareviatura
  importe: number
  categoria?: { id; nombre }
}`,
PrecioCategoriaRetorno: `{
  id: string
  nombre: string
}`,
PropuestaRetorno: `{
  id: string
  fechaCreacion?: Date
  fechaActualizacion?: Date
  deleted?: boolean
  nombre: string
  libros: LibroRetorno[]
}`,
SedeRetorno: `{
  id: string
  fechaCreacion?: Date
  fechaActualizacion?: Date
  deleted?: boolean
  nombre: string
}`,
SolicitudRetorno: `{
  id: string
  idLibroCompleto: string
  nombreLibro: string
  fechaCreacion: Date
  fechaResolucion: Date | null
  idUsuario: string
  nombreUsuario: string
  estado: number  (1=pendiente,2=aceptada,3=rechazada)
  idEmpresa: string
  peticiones: PeticionRetorno[]
}`,
PeticionRetorno: `{
  id: string
  campo: string
  valorAnterior: string | null
  valorNuevo: string | null
  observaciones: string | null
  estado: number
}`,
UsuarioRetorno: `{
  id: string
  fechaCreacion?: Date
  fechaActualizacion?: Date
  deleted?: boolean
  nombre: string
  email: string
  role: Role  (super_admin | admin | operador)
}`,
ResumenRetorno: `{
  id: string
  pendiente: number
  listo: number
  retirado: number
  cancelado: number
  stock?: number
}`,
};

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const app = document.getElementById('app');
  app.innerHTML = '';
  DATA.forEach(ent => {
    const eps = ent.eps.filter(e =>
      !q || ent.entity.toLowerCase().includes(q) || e.r + ' ' + e.m + ' ' + e.d.toLowerCase().includes(q)
    );
    if (!eps.length) return;
    const det = document.createElement('details');
    det.className = 'entity';
    det.open = !!q;
    const sum = document.createElement('summary');
    sum.textContent = ent.entity + ' (' + eps.length + ')';
    det.appendChild(sum);
    const box = document.createElement('div');
    box.className = 'endpoints';
    eps.forEach(e => {
      const ep = document.createElement('details');
      ep.className = 'ep';
      const es = document.createElement('summary');
      const meth = document.createElement('span');
      meth.className = 'method ' + e.m;
      meth.textContent = e.m;
      const route = document.createElement('span');
      route.className = 'route';
      route.textContent = e.r;
      const guard = document.createElement('span');
      guard.className = 'guard';
      guard.textContent = e.g;
      es.appendChild(meth);
      es.appendChild(route);
      es.appendChild(guard);
      ep.appendChild(es);
      const body = document.createElement('div');
      body.className = 'body';
      const p = document.createElement('p');
      p.className = 'desc';
      p.textContent = e.d;
      body.appendChild(p);
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = 'Retorna:';
      body.appendChild(st);
      const pre = document.createElement('pre');
      pre.className = 'ret';
      // resolve return type name (strip array/generics)
      let key = e.ret.replace(/[\[\]]/g,'').replace(/[^A-Za-z]/g,'');
      // find a RETS key that matches start
      let retText = RETS[e.ret.split(' ')[0].replace(/[^A-Za-z]/g,'')] || null;
      if (!retText) {
        // try first token
        const tok = e.ret.match(/[A-Za-z]+Retorno|[A-Za-z]+Prop/);
        if (tok && RETS[tok[0]]) retText = RETS[tok[0]];
      }
      pre.textContent = retText || e.ret;
      body.appendChild(pre);
      ep.appendChild(body);
      box.appendChild(ep);
    });
    det.appendChild(box);
    app.appendChild(det);
  });
}
render();
</script>
</body>
</html>
